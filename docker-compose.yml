networks:
    external:
        driver: bridge
    internal:

services:
    app:
        build:
            context: .
            dockerfile: .docker/images/app/Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_app
        depends_on:
            cache:
                condition: service_healthy
        networks:
            internal:
                aliases:
                    - ${COMPOSE_PROJECT_NAME}-app.docker
        volumes:
            - .:/var/www
            - app_cache:/var/www/var/cache

    cache:
        build:
            context: .
            dockerfile: .docker/images/redis/Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_cache
        networks:
            internal:
                aliases:
                    - ${COMPOSE_PROJECT_NAME}-cache.docker

    web:
        build:
            context: .
            dockerfile: .docker/images/web/Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_web
        depends_on:
            app:
                condition: service_healthy
        env_file:
            - .env
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_web.entrypoints=web"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_web.rule=Host(`${APP_DOMAIN}`)"
            - "traefik.http.services.${COMPOSE_PROJECT_NAME}_web.loadbalancer.server.port=80"
        networks:
            external:
            internal:
                aliases:
                    - ${COMPOSE_PROJECT_NAME}-web.docker
        volumes:
            - ./public:/var/www/public

volumes:
    app_cache:
