networks:
    external:
        driver: bridge
    internal:

x-app-common: &app-common
    build:
        context: .
        dockerfile: .docker/images/php-fpm/Dockerfile
    volumes:
        - .:/var/www

services:
    app:
        <<: *app-common
        container_name: ${COMPOSE_PROJECT_NAME}_app
        depends_on:
            cache:
                condition: service_healthy
            database:
                condition: service_healthy
        networks:
            internal:
                aliases:
                    - ${COMPOSE_PROJECT_NAME}-app.docker

    test-runner:
        <<: *app-common
        command: php bin/phpunit --do-not-cache-result
        container_name: ${COMPOSE_PROJECT_NAME}_test_runner
        depends_on:
            app:
                condition: service_healthy
        environment:
            APP_ENV: test

    cache:
        build:
            context: .
            dockerfile: .docker/images/redis/Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_cache
        networks:
            internal:
                aliases:
                    - ${COMPOSE_PROJECT_NAME}-cache.docker

    database:
        build:
            context: .
            dockerfile: .docker/images/mariadb/Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_database
        environment:
            MYSQL_ROOT_PASSWORD: 5ecr3t
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
        networks:
            internal:
                aliases:
                    - ${COMPOSE_PROJECT_NAME}-database.docker
        volumes:
            - app_database:/var/lib/mysql

    db_admin:
        image: phpmyadmin:5.2-apache
        container_name: ${COMPOSE_PROJECT_NAME}_db_admin
        depends_on:
            database:
                condition: service_healthy
        environment:
            PMA_HOST: ${COMPOSE_PROJECT_NAME}-database.docker
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}
        networks:
            external:
            internal:
                aliases:
                    - ${COMPOSE_PROJECT_NAME}-db_admin.docker
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_db_admin.entrypoints=web"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_db_admin.rule=Host(`pma.${APP_DOMAIN}`)"
            - "traefik.http.services.${COMPOSE_PROJECT_NAME}_db_admin.loadbalancer.server.port=80"

    web:
        build:
            context: .
            dockerfile: .docker/images/nginx/Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME}_web
        depends_on:
            app:
                condition: service_healthy
        env_file:
            - .env
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_web.entrypoints=web"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_web.rule=Host(`${APP_DOMAIN}`)"
            - "traefik.http.services.${COMPOSE_PROJECT_NAME}_web.loadbalancer.server.port=80"
        networks:
            external:
            internal:
                aliases:
                    - ${COMPOSE_PROJECT_NAME}-web.docker
        volumes:
            - ./public:/var/www/public

volumes:
    app_database:
